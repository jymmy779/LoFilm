name: Deploy to Server

on:
  push:
    branches:
      - main # Chạy khi có code push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/lofilm
            
            # 1. Cập nhật code mới nhất từ nhánh main
            git pull origin main
            
            # 2. Cài đặt và build Frontend
            npm install
            npm run build
            
            # 3. Cài đặt và build Backend
            if [ -d "backend" ]; then
              cd backend
              npm install
              npx prisma generate
              npx prisma db push
              npm run build
              pm2 startOrReload ecosystem.config.cjs
              cd ..
            fi
            
            # 4. Khởi động lại toàn bộ tiến trình PM2
            pm2 reload all
            pm2 save
