name: Deploy to Server

on:
  push:
    branches:
      - main # Chạy khi có code push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/lofilm
            
            # Cập nhật code mới nhất từ nhánh main
            git pull origin main
            
            # (Tùy chọn) Ghi đè file .env từ GitHub Secrets nếu bạn muốn quản lý env trên GitHub
            # echo "${{ secrets.ENV_FILE }}" > .env
            
            # Cài đặt thư viện mới (nếu không có gì mới thì lệnh này chạy rất nhanh)
            npm install
            
            # Build project
            npm run build
            
            # Khởi động lại pm2
            pm2 reload all
